database:
  host: localhost
  port: 5432
  name: weather_madagascar
  user: ${DB_USER}
  password: ${DB_PASSWORD}

api:
  open_meteo:
    base_url: "https://api.open-meteo.com/v1/forecast"
    current_variables:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - wind_speed_10m
      - surface_pressure
    hourly_variables:
      - temperature_2m
      - relative_humidity_2m
      - precipitation
      - wind_speed_10m
      - surface_pressure
    daily_variables:
      - temperature_2m_max
      - temperature_2m_min
      - precipitation_sum
      - wind_speed_10m_max
      - uv_index_max
    timezone: "Indian/Antananarivo"

pipeline:
  extraction:
    current_interval_minutes: 60
    daily_run_time: "06:00"
  airflow:
    dag_id: weather_etl_dag
    retries: 3
    retry_delay_minutes: 5
    email_on_failure: true
